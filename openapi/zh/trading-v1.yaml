    "/dex_futures/{settle}/order_book": {
      "get": {
        "tags": [
          "行情"
        ],
        "operationId": "listDEXFuturesOrderBook",
        "summary": "查询合约市场深度信息",
        "description": "买单会按照价格从高到低排序，卖单反之",
        "parameters": [
          {
            "name": "settle",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "enum": [
                "usdt"
              ]
            },
            "description": "结算货币"
          },
          {
            "name": "contract",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string"
            },
            "description": "合约标识"
          },
          {
            "name": "interval",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string"
            },
            "description": "合并深度指定的价格精度，0 为不合并，不指定则默认为 0"
          },
          {
            "name": "limit",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer"
            },
            "description": "深度档位数量"
          },
          {
            "name": "with_id",
            "in": "query",
            "required": false,
            "schema": {
              "type": "boolean"
            },
            "description": "是否返回深度更新 ID。深度每发生一次变化，该 ID 自增 1"
          }
        ],
        "responses": {
          "200": {
            "description": "深度查询成功",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "id": {
                      "type": "integer",
                      "format": "int64",
                      "description": "深度更新 ID，深度每发生一次变化，该 ID 加 1，只有设置 with_id=true 时才返回"
                    },
                    "current": {
                      "type": "number",
                      "format": "double",
                      "description": "接口数据返回时间戳"
                    },
                    "update": {
                      "type": "number",
                      "format": "double",
                      "description": "深度变化时间戳"
                    },
                    "asks": {
                      "type": "array",
                      "items": {
                        "type": "object",
                        "properties": {
                          "p": {
                            "type": "string",
                            "description": "价格 (计价货币)"
                          },
                          "s": {
                            "type": "string",
                            "description": "数量"
                          }
                        }
                      },
                      "description": "卖方深度列表"
                    },
                    "bids": {
                      "type": "array",
                      "items": {
                        "type": "object",
                        "properties": {
                          "p": {
                            "type": "string",
                            "description": "价格 (计价货币)"
                          },
                          "s": {
                            "type": "string",
                            "description": "数量"
                          }
                        }
                      },
                      "description": "买方深度列表"
                    }
                  }
                },
                "example": {
                  "id": 123456,
                  "current": 1623898993.123,
                  "update": 1623898993.121,
                  "asks": [
                    {
                      "p": "1.52",
                      "s": "100"
                    },
                    {
                      "p": "1.53",
                      "s": "40"
                    }
                  ],
                  "bids": [
                    {
                      "p": "1.17",
                      "s": "150"
                    },
                    {
                      "p": "1.16",
                      "s": "203"
                    }
                  ]
                }
              }
            }
          }
        },
        "security": []
      }
    },
    "/dex_futures/{settle}/trades": {
      "get": {
        "tags": [
          "行情"
        ],
        "operationId": "listDEXFuturesTrades",
        "summary": "合约市场成交记录",
        "parameters": [
          {
            "name": "settle",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "enum": [
                "usdt"
              ]
            },
            "description": "结算货币"
          },
          {
            "name": "contract",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string"
            },
            "description": "合约标识"
          },
          {
            "name": "limit",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer"
            },
            "description": "列表返回的最大数量"
          },
          {
            "name": "offset",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer"
            },
            "description": "列表返回的偏移量，从 0 开始"
          },
          {
            "name": "last_id",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string"
            },
            "description": "以上个列表的最后一条记录的 ID 作为下个列表的起点。"
          },
          {
            "name": "from",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "format": "int64"
            },
            "description": "指定起始时间，时间格式为秒(s)精度的 Unix 时间戳。 不指定则按照 to 和 limit 来限定返回的数量。"
          },
          {
            "name": "to",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "format": "int64"
            },
            "description": "指定结束时间，不指定则默认当前时间，时间格式为秒(s)精度的 Unix 时间戳"
          }
        ],
        "responses": {
          "200": {
            "description": "列表查询成功",
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {
                    "type": "object",
                    "properties": {
                      "id": {
                        "type": "integer",
                        "format": "int64",
                        "description": "成交记录 ID"
                      },
                      "create_time": {
                        "type": "number",
                        "format": "double",
                        "description": "成交时间"
                      },
                      "contract": {
                        "type": "string",
                        "description": "合约标识"
                      },
                      "size": {
                        "type": "string",
                        "description": "成交数量"
                      },
                      "price": {
                        "type": "string",
                        "description": "成交价格 (计价货币)"
                      }
                    }
                  }
                },
                "example": [
                  {
                    "id": 121234231,
                    "create_time": 1514764800,
                    "contract": "BTC_USDT",
                    "size": "-100",
                    "price": "100.123"
                  }
                ]
              }
            }
          }
        },
        "security": []
      }
    },
    "/dex_futures/{settle}/candlesticks": {
      "get": {
        "tags": [
          "行情"
        ],
        "operationId": "listDEXFuturesCandlesticks",
        "summary": "合约市场 K 线图",
        "description": "如果 contract 字段在合约标识前增加了 mark_ 前缀则返回标记价格数据(如mark_BTC_USD)， 如果增加了 index_ 则返回指数价格的数据(如index_BTC_USD)\nK 线图数据单次请求最大返回 2000 个点，指定 from, to 和 interval 的时候注意点数不能过多。",
        "parameters": [
          {
            "name": "settle",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "enum": [
                "usdt"
              ]
            },
            "description": "结算货币"
          },
          {
            "name": "contract",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string"
            },
            "description": "合约标识"
          },
          {
            "name": "from",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "format": "int64"
            },
            "description": "指定 K 线图的起始时间，注意时间格式为秒(s)精度的 Unix 时间戳，不指定则默认为 to - 100 * interval，即向前最多 100 个点的时间"
          },
          {
            "name": "to",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "format": "int64"
            },
            "description": "指定 K 线图的结束时间，不指定则默认当前时间，注意时间格式为秒(s)精度的 Unix 时间戳"
          },
          {
            "name": "limit",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer"
            },
            "description": "指定数据点的数量，适用于取最近 limit 数量的数据，该字段与 from , to 互斥，如果指定了 from , to 中的任意字段，该字段会被拒绝"
          },
          {
            "name": "interval",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "enum": [
                "10s",
                "1m",
                "5m",
                "15m",
                "30m",
                "1h",
                "4h",
                "8h",
                "1d",
                "7d"
              ]
            },
            "description": "数据点的时间间隔，注意 1w 代表一个自然周，7d 的时间是和 Unix 初始时间对齐, 30d 代表一个自然月"
          },
          {
            "name": "timezone",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string"
            },
            "description": "时区,all/utc0/utc8，默认utc0"
          }
        ],
        "responses": {
          "200": {
            "description": "成功查询",
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {
                    "type": "object",
                    "properties": {
                      "t": {
                        "type": "number",
                        "format": "double",
                        "description": "秒 s 精度的 Unix 时间戳"
                      },
                      "v": {
                        "type": "string",
                        "description": "交易量，只有市场行情的 K 线数据里有该值 (合约张数)"
                      },
                      "c": {
                        "type": "string",
                        "description": "收盘价 (计价货币)"
                      },
                      "h": {
                        "type": "string",
                        "description": "最高价 (计价货币)"
                      },
                      "l": {
                        "type": "string",
                        "description": "最低价 (计价货币)"
                      },
                      "o": {
                        "type": "string",
                        "description": "开盘价 (计价货币)"
                      },
                      "sum": {
                        "type": "string",
                        "description": "交易额，单位是计价货币"
                      }
                    }
                  }
                },
                "example": [
                  {
                    "t": 1539852480,
                    "v": "97151",
                    "c": "1.032",
                    "h": "1.032",
                    "l": "1.032",
                    "o": "1.032",
                    "sum": "3580"
                  }
                ]
              }
            }
          }
        },
        "security": []
      }
    },
