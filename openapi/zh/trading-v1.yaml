    "/dex_futures/{settle}/tickers": {
      "get": {
        "tags": [
          "行情"
        ],
        "operationId": "listDEXFuturesTickers",
        "summary": "获取所有合约交易行情统计",
        "parameters": [
          {
            "name": "settle",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "enum": [
                "usdt"
              ]
            },
            "description": "结算货币"
          },
          {
            "name": "contract",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string"
            },
            "description": "合约标识，如果指定则只返回该合约相关数据"
          }
        ],
