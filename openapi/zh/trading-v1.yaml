    "/dex_futures/{settle}/countdown_cancel_all": {
      "post": {
        "tags": [
          "订单"
        ],
        "operationId": "countdownCancelAllDEXFutures",
        "summary": "倒计时取消订单",
        "description": "合约订单心跳检测，在到达用户设置的 timeout 时间时如果没有取消既有倒计时或设置新的倒计时将会自动取消相关的 合约挂单 。 该接口可重复调用，以便设置新的倒计时或取消倒计时。 用法示例： 以30s的间隔重复此接口，每次倒计时 timeout 设置为30(秒)。 如果在30秒内未再次调用此接口，则您指定 market 上的所有挂单都会被自动撤销。 如果在30秒内以将 timeout 设置为0，则倒数计时器将终止，自动撤单功能取消。",
        "parameters": [
          {
            "name": "settle",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "enum": [
                "usdt"
              ]
            },
            "description": "结算货币"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "timeout": {
                    "type": "integer",
                    "format": "int32",
                    "description": "Countdown time in seconds"
                  },
                  "contract": {
                    "type": "string",
                    "description": "Perp contract"
                  }
                },
                "required": [
                  "timeout"
                ]
              },
              "example": {
                "timeout": 30,
                "contract": "BTC_USDT"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "设置倒计时成功",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "triggerTime": {
                      "type": "integer",
                      "format": "int64",
                      "description": "倒计时结束时的时间戳，毫秒"
                    }
                  }
                },
                "example": {
                  "triggerTime": "1660039145000"
                }
              }
            }
          }
        },
        "security": [
          {
            "ApiKey": [],
            "Timestamp": [],
            "Signature": []
          }
        ]
      }
