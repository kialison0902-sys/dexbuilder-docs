        "operationId": "createBatchDEXFuturesOrder",
        "summary": "合约交易批量下单",
        "description": "- 最多指定10个委托\n- 如果有某个委托的参数缺失或格式错误，则全部不执行，并直接返回400错误\n- 如果参数检查通过，则全部执行。即便中间有业务逻辑错误（比如资金不足），也不会影响其他执行委托\n- 返回结果是数组格式，顺序跟请求体中的委托一一对应\n- 返回结果的数组成员中，通过bool类型的 successed 字段，代表是否执行成功\n- 如果执行成功，则包含正常委托内容；如果执行失败，则包括 label 字段表示错误原因\n- 在访问频率限制中，每个委托都单独计一次",
        "parameters": [
          {
            "name": "settle",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "enum": [
                "usdt"
              ]
            },
            "description": "结算货币"
          }
