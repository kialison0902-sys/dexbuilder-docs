                      },
                      "size": {
                        "type": "string",
                        "description": "必选。交易数量，正数为买入，负数为卖出。平仓委托则设置为0。"
                      },
                      "iceberg": {
                        "type": "string",
                        "description": "冰山委托显示数量。0为完全不隐藏。注意，隐藏部分成交按照taker收取手续费。"
                      },
                      "left": {
                        "type": "string",
                        "description": "未成交数量"
                      },
                      "price": {
                        "type": "string",
                        "description": "委托价。价格为0并且 tif 为 ioc ，代表市价委托。"
                      },
                      "fill_price": {
                        "type": "string",
                        "description": "成交价"
                      },
                      "mkfr": {
                        "type": "string",
                        "description": "做单费率"
                      },
                      "tkfr": {
                        "type": "string",
                        "description": "吃单费率"
                      },
                      "tif": {
                        "type": "string",
                        "description": "Time in force 策略，市价单当前只支持 ioc 模式 - gtc: GoodTillCancelled - ioc: ImmediateOrCancelled，立即成交或者取消，只吃单不挂单 - poc: PendingOrCancelled，被动委托，只挂单不吃单 - fok: FillOrKill, 完全成交，或者完全取消"
                      },
                      "refu": {
                        "type": "integer",
                        "description": "推荐人用户 ID"
                      },
                      "is_reduce_only": {
                        "type": "boolean",
                        "description": "是否为只减仓委托。对应请求中的 reduce_only 。"
                      },
                      "is_close": {
                        "type": "boolean",
                        "description": "是否为平仓委托。对应请求中的 close 。"
                      },
                      "is_liq": {
                        "type": "boolean",
                        "description": "是否为强制平仓委托"
                      },
                      "text": {
                        "type": "string",
                        "description": "订单自定义信息，用户可以用该字段设置自定义 ID，用户自定义字段必须满足以下条件： 1. 必须以 t- 开头 2. 不计算 t- ，长度不能超过 28 字节 3. 输入内容只能包含数字、字母、下划线(_)、中划线(-) 或者点(.) 除用户自定义信息以外，以下为内部保留字段，标识订单来源: - web: 网页 - api: API 调用 - app: 移动端 - auto_deleveraging: 自动减仓 - liquidation: 强制平仓 - insurance: 保险"
                      },
                      "status": {
                        "type": "string",
                        "description": "订单状态。 - open : 等待处理 - finished : 已结束的订单"
                      },
                      "finish_time": {
                        "type": "number",
                        "format": "double",
                        "description": "订单结束时间，未结束订单无此字段返回"
                      },
                      "finish_as": {
                        "type": "string",
                        "description": "结束方式，包括： - filled: 完全成交 - cancelled: 用户撤销 - liquidated: 强制平仓撤销 - ioc: 未立即完全成交，因为tif设置为ioc - auto_deleveraged: 自动减仓撤销 - reduce_only: 增持仓位撤销，因为设置reduce_only或平仓 - position_closed: 因为仓位平掉了，所以挂单被撤掉 - reduce_out: 只减仓被排除的不容易成交的挂单 - stp: 订单发生自成交限制而被撤销"
                      },
                      "stp_id": {
                        "type": "integer",
                        "description": "订单所属的 STP用户组 id，同一个 STP用户组 内用户之间的订单不允许发生自成交。 1. 如果撮合时两个订单的 stp_id 非 0 且相等，则不成交，而是根据 taker 的 stp_act 执行相应策略。 2. 没有设置 STP用户组 成交的订单， stp_id 默认返回 0 。"
                      },
                      "stp_act": {
                        "type": "string",
                        "description": "Self-Trading Prevention Action,用户可以用该字段设置自定义限制自成交策略。 1. 用户在设置加入 STP用户组 后，可以通过传递 stp_act 来限制用户发生自成交的策略，没有传递 stp_act 默认按照 cn 的策略。 2. 用户在没有设置加入 STP用户组 时，传递 stp_act 参数会报错。 3. 用户没有使用 stp_act 发生成交的订单， stp_act 返回 - 。 - cn: Cancel newest,取消新订单，保留老订单 - co: Cancel oldest,取消⽼订单，保留新订单 - cb: Cancel both,新旧订单都取消"
                      },
                      "amend_text": {
                        "type": "string"
                      },
                      "market_order_slip_ratio": {
                        "type": "string",
                        "description": "最大滑点比率"
                      }
                    }
                  }
                },
                "example": [
                  {
                    "succeeded": true,
                    "id": 15675394,
                    "user": 100000,
