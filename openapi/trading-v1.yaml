            "writeOnly": true,
            "enum": [
              "close_long",
              "close_short"
            ]
          },
          "stp_id": {
            "type": "integer",
            "description": "Orders between users in the same stp_id group are not allowed to be self-traded 1. If the stp_id of two orders being matched is non-zero and equal, they will not be executed. Instead, the corresponding strategy will be executed based on the stp_act of the taker. 2. stp_id returns 0 by default for orders that have not been set for STP group",
            "readOnly": true
          },
          "stp_act": {
            "type": "string",
            "description": "Self-Trading Prevention Action. Users can use this field to set self-trade prevention strategies 1. After users join the STP Group , they can pass stp_act to limit the user's self-trade prevention strategy. If stp_act is not passed, the default is cn strategy. 2. When the user does not join the STP group , an error will be returned when passing the stp_act parameter. 3. If the user did not use stp_act when placing the order, stp_act will return '-' - cn: Cancel newest, cancel new orders and keep old ones - co: Cancel oldest, cancel old orders and keep new ones - cb: Cancel both, both old and new orders will be cancelled",
            "enum": [
              "co",
              "cn",
              "cb",
              "-"
            ]
          },
