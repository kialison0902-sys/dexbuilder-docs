            "type": "string",
            "description": "How the order was finished: - filled: all filled - cancelled: manually cancelled - liquidated: cancelled because of liquidation - ioc: time in force is IOC , finish immediately - auto_deleveraged: finished by ADL - reduce_only: cancelled because of increasing position while reduce-only set - position_closed: cancelled because the position was closed - reduce_out: only reduce positions by excluding hard-to-fill orders - stp: cancelled because self trade prevention",
            "readOnly": true,
            "enum": [
              "filled",
              "cancelled",
              "liquidated",
              "ioc",
              "auto_deleveraged",
              "reduce_only",
