    "/dex_futures/{settle}/batch_orders": {
      "post": {
        "tags": [
          "Orders"
        ],
        "operationId": "createBatchDEXFuturesOrder",
        "summary": "Place batch Perp orders",
        "description": "- Up to 10 orders per request\n- If any of the order's parameters are missing or in the wrong format, all of them will not be executed, and a http status 400 error will be returned directly\n- If the parameters are checked and passed, all are executed. Even if there is a business logic error in the middle (such as insufficient funds), it will not affect other execution orders\n- The returned result is in array format, and the order corresponds to the orders in the request body\n- In the returned result, the succeeded field of type bool indicates whether the execution was successful or not\n- If the execution is successful, the normal order content is included; if the execution fails, the label field is included to indicate the cause of the error\n- In the rate limiting, each order is counted individually",
        "parameters": [
          {
            "name": "settle",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "enum": [
                "usdt"
              ]
            },
            "description": "Settle currency"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "array",
                "items": {
                  "$ref": "#/components/schemas/DEXFuturesOrder"
                }
              },
              "example": [
                {
                  "contract": "BTC_USDT",
                  "size": "6024",
                  "iceberg": "0",
                  "price": "3765",
                  "tif": "gtc",
                  "text": "t-my-custom-id",
                  "stp_act": "-",
                  "order_value": "64112.2099000000005",
                  "trade_value": "64112.2099000000005",
                  "market_order_slip_ratio": "0.03"
                }
              ]
            }
          }
        },
        "responses": {
          "200": {
            "description": "Request execution completed",
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {
                    "type": "object",
                    "properties": {
                      "succeeded": {
                        "type": "boolean",
                        "description": "Request execution result"
                      },
                      "id": {
                        "type": "integer",
                        "format": "int64",
                        "description": "Perp order ID"
                      },
                      "user": {
                        "type": "integer",
                        "description": "User ID"
                      },
                      "contract": {
                        "type": "string",
                        "description": "Perp contract"
                      },
                      "create_time": {
                        "type": "number",
                        "format": "double",
                        "description": "Creation time of order"
                      },
                      "size": {
                        "type": "string",
                        "description": "Required. Trading quantity. Positive for buy, negative for sell. Set to 0 for close position orders."
                      },
                      "iceberg": {
                        "type": "string",
                        "description": "Display size for iceberg orders. 0 for non-iceberg orders. Note that hidden portions are charged taker fees."
                      },
                      "left": {
                        "type": "string",
                        "description": "Unfilled quantity"
                      },
                      "price": {
                        "type": "string",
                        "description": "Order price. Price of 0 with tif set to ioc represents a market order."
                      },
                      "fill_price": {
                        "type": "string",
                        "description": "Fill price"
                      },
                      "mkfr": {
                        "type": "string",
                        "description": "Maker fee"
                      },
                      "tkfr": {
                        "type": "string",
                        "description": "Taker fee"
                      },
                      "tif": {
                        "type": "string",
                        "description": "Time in force - gtc: GoodTillCancelled - ioc: ImmediateOrCancelled, taker only - poc: PendingOrCancelled, makes a post-only order that always enjoys a maker fee - fok: FillOrKill, fill either completely or none"
                      },
                      "refu": {
                        "type": "integer",
                        "description": "Referrer user ID"
                      },
                      "is_reduce_only": {
                        "type": "boolean",
                        "description": "Is the order reduce-only"
                      },
                      "is_close": {
                        "type": "boolean",
                        "description": "Is the order to close position"
                      },
                      "is_liq": {
                        "type": "boolean",
                        "description": "Is the order for liquidation"
                      },
                      "text": {
                        "type": "string",
                        "description": "User defined information. If not empty, must follow the rules below: 1. prefixed with t- 2. no longer than 28 bytes without t- prefix 3. can only include 0-9, A-Z, a-z, underscore(_), hyphen(-) or dot(.) Besides user defined information, reserved contents are listed below, denoting how the order is created: - web: from web - api: from API - app: from mobile phones - auto_deleveraging: from ADL - liquidation: from liquidation - insurance: from insurance"
                      },
                      "status": {
                        "type": "string",
                        "description": "Order status - open : Pending - finished : Completed"
                      },
                      "finish_time": {
                        "type": "number",
                        "format": "double",
                        "description": "Order finished time. Not returned if order is open"
                      },
                      "finish_as": {
                        "type": "string",
                        "description": "How the order was finished: - filled: all filled - cancelled: manually cancelled - liquidated: cancelled because of liquidation - ioc: time in force is IOC , finish immediately - auto_deleveraged: finished by ADL - reduce_only: cancelled because of increasing position while reduce-only set - position_closed: cancelled because the position was closed - reduce_out: only reduce positions by excluding hard-to-fill orders - stp: cancelled because self trade prevention"
                      },
                      "stp_id": {
                        "type": "integer",
                        "description": "Orders between users in the same stp_id group are not allowed to be self-traded 1. If the stp_id of two orders being matched is non-zero and equal, they will not be executed. Instead, the corresponding strategy will be executed based on the stp_act of the taker. 2. stp_id returns 0 by default for orders that have not been set for STP group"
                      },
                      "stp_act": {
                        "type": "string",
                        "description": "Self-Trading Prevention Action. Users can use this field to set self-trade prevention strategies 1. After users join the STP Group , they can pass stp_act to limit the user's self-trade prevention strategy. If stp_act is not passed, the default is cn strategy. 2. When the user does not join the STP group , an error will be returned when passing the stp_act parameter. 3. If the user did not use stp_act when placing the order, stp_act will return '-' - cn: Cancel newest, cancel new orders and keep old ones - co: Cancel oldest, cancel old orders and keep new ones - cb: Cancel both, both old and new orders will be cancelled"
                      },
                      "amend_text": {
                        "type": "string"
                      },
                      "market_order_slip_ratio": {
                        "type": "string",
                        "description": "The maximum slippage ratio"
                      }
                    }
                  }
                },
                "example": [
                  {
                    "succeeded": true,
                    "id": 15675394,
                    "user": 100000,
                    "contract": "BTC_USDT",
                    "create_time": 1546569968,
                    "size": "6024",
                    "iceberg": "0",
                    "left": "6024",
                    "price": "3765",
                    "fill_price": "0",
                    "mkfr": "-0.00025",
                    "tkfr": "0.00075",
                    "tif": "gtc",
                    "refu": 0,
                    "is_reduce_only": false,
                    "is_close": false,
                    "is_liq": false,
                    "text": "t-my-custom-id",
                    "status": "finished",
                    "finish_time": 1514764900,
                    "finish_as": "cancelled",
                    "stp_id": 0,
                    "stp_act": "-",
                    "amend_text": "-",
                    "market_order_slip_ratio": "0.03"
                  }
                ]
              }
            }
          }
        },
        "security": [
          {
            "ApiKey": [],
            "Timestamp": [],
            "Signature": []
          }
        ]
      }
    },
