    "/dex_futures/{settle}/countdown_cancel_all": {
      "post": {
        "tags": [
          "Orders"
        ],
        "operationId": "countdownCancelAllDEXFutures",
        "summary": "Countdown cancel orders",
        "description": "Heartbeat detection for contract orders: When the user-set timeout time is reached, if neither the existing countdown is canceled nor a new countdown is set, the relevant contract orders will be automatically canceled. This API can be called repeatedly to or cancel the countdown. Usage example: Repeatedly call this API at 30-second intervals, setting the timeout to 30 (seconds) each time. If this API is not called again within 30 seconds, all open orders on your specified market will be automatically canceled. If the timeout is set to 0 within 30 seconds, the countdown timer will terminate, and the automatic order cancellation function will be disabled.",
        "parameters": [
          {
            "name": "settle",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "enum": [
                "usdt"
              ]
            },
            "description": "Settle currency"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "timeout": {
                    "type": "integer",
                    "format": "int32",
                    "description": "Countdown time in seconds"
                  },
                  "contract": {
                    "type": "string",
                    "description": "Perp contract"
                  }
                },
                "required": [
                  "timeout"
                ]
              },
              "example": {
                "timeout": 30,
                "contract": "BTC_USDT"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Countdown set successfully",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "triggerTime": {
                      "type": "integer",
                      "format": "int64",
                      "description": "Timestamp when countdown ends, in milliseconds"
                    }
                  }
                },
                "example": {
                  "triggerTime": "1660039145000"
                }
              }
            }
          }
        },
        "security": [
          {
            "ApiKey": [],
            "Timestamp": [],
            "Signature": []
          }
        ]
      }
    },
