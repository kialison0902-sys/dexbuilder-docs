                      },
                      "size": {
                        "type": "string",
                        "description": "Trading size"
                      },
                      "price": {
                        "type": "string",
                        "description": "Trade price (quote currency)"
                      }
                    }
                  }
                },
                "example": [
                  {
                    "id": 121234231,
                    "create_time": 1514764800,
                    "contract": "BTC_USDT",
                    "size": "-100",
                    "price": "100.123"
                  }
                ]
              }
            }
          }
        },
        "security": []
      }
    },
    "/dex_futures/{settle}/candlesticks": {
      "get": {
        "tags": [
          "Markets"
        ],
        "operationId": "listDEXFuturesCandlesticks",
        "summary": "Perp market K-line chart",
        "description": "Return specified contract candlesticks. If prefix contract with mark_ , the contract's mark price candlesticks are returned; if prefix with index_ , index price candlesticks will be returned.\nMaximum of 2000 points are returned in one query. Be sure not to exceed the limit when specifying from , to and interval",
        "parameters": [
          {
            "name": "settle",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "enum": [
                "usdt"
              ]
            },
            "description": "Settle currency"
          },
          {
            "name": "contract",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string"
            },
            "description": "Perp contract"
          },
          {
            "name": "from",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "format": "int64"
            },
            "description": "Start time of candlesticks, formatted in Unix timestamp in seconds. Default to to - 100 * interval if not specified"
          },
          {
            "name": "to",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "format": "int64"
            },
            "description": "Specify the end time of the K-line chart, defaults to current time if not specified, note that the time format is Unix timestamp with second precision"
          },
          {
            "name": "limit",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer"
            },
            "description": "Maximum number of recent data points to return. limit conflicts with from and to . If either from or to is specified, request will be rejected."
          },
          {
            "name": "interval",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "enum": [
                "10s",
                "1m",
                "5m",
                "15m",
                "30m",
                "1h",
                "4h",
                "8h",
                "1d",
                "7d"
              ]
            },
            "description": "Interval time between data points. Note that 1w means natural week(Mon-Sun), while 7d means every 7d since unix 0. 30d represents a natural month, not 30 days"
          },
          {
            "name": "timezone",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string"
            },
            "description": "Time zone: all/utc0/utc8, default utc0"
          }
        ],
        "responses": {
          "200": {
            "description": "Query successful",
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {
                    "type": "object",
                    "properties": {
                      "t": {
                        "type": "number",
                        "format": "double",
                        "description": "Unix timestamp in seconds"
                      },
                      "v": {
                        "type": "string",
                        "description": "size volume (contract size). Only returned if contract is not prefixed"
                      },
                      "c": {
                        "type": "string",
                        "description": "Close price (quote currency)"
                      },
                      "h": {
                        "type": "string",
                        "description": "Highest price (quote currency)"
                      },
                      "l": {
                        "type": "string",
                        "description": "Lowest price (quote currency)"
                      },
                      "o": {
                        "type": "string",
                        "description": "Open price (quote currency)"
                      },
                      "sum": {
                        "type": "string",
                        "description": "Trading volume (unit: Quote currency)"
                      }
                    }
                  }
                },
                "example": [
                  {
                    "t": 1539852480,
                    "v": "97151",
                    "c": "1.032",
                    "h": "1.032",
                    "l": "1.032",
                    "o": "1.032",
                    "sum": "3580"
                  }
                ]
              }
            }
          }
        },
        "security": []
      }
    },
