    "/dex_futures/{settle}/order_book": {
      "get": {
        "tags": [
          "Markets"
        ],
        "operationId": "listDEXFuturesOrderBook",
        "summary": "Query Perp market depth information",
        "description": "Bids will be sorted by price from high to low, while asks sorted reversely",
        "parameters": [
          {
            "name": "settle",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "enum": [
                "usdt"
              ]
            },
            "description": "Settle currency"
          },
          {
            "name": "contract",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string"
            },
            "description": "Perp contract"
          },
          {
            "name": "interval",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string"
            },
            "description": "Price precision for depth aggregation, 0 means no aggregation, defaults to 0 if not specified"
          },
          {
            "name": "limit",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer"
            },
            "description": "Number of depth levels"
          },
          {
            "name": "with_id",
            "in": "query",
            "required": false,
            "schema": {
              "type": "boolean"
            },
            "description": "Whether to return depth update ID. This ID increments by 1 each time the depth changes"
          }
        ],
        "responses": {
          "200": {
            "description": "Depth query successful",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "id": {
                      "type": "integer",
                      "format": "int64",
                      "description": "Order Book ID. Increases by 1 on every order book change. Set with_id=true to include this field in response"
                    },
                    "current": {
                      "type": "number",
                      "format": "double",
                      "description": "Response data generation timestamp"
                    },
                    "update": {
                      "type": "number",
                      "format": "double",
                      "description": "Order book changed timestamp"
                    },
                    "asks": {
                      "type": "array",
                      "items": {
                        "type": "object",
                        "properties": {
                          "p": {
                            "type": "string",
                            "description": "Price (quote currency)"
                          },
                          "s": {
                            "type": "string",
                            "description": "Size"
                          }
                        }
                      },
                      "description": "Ask Depth"
                    },
                    "bids": {
                      "type": "array",
                      "items": {
                        "type": "object",
                        "properties": {
                          "p": {
                            "type": "string",
                            "description": "Price (quote currency)"
                          },
                          "s": {
                            "type": "string",
                            "description": "Size"
                          }
                        }
                      },
                      "description": "Bid Depth"
                    }
                  }
                },
                "example": {
                  "id": 123456,
                  "current": 1623898993.123,
                  "update": 1623898993.121,
                  "asks": [
                    {
                      "p": "1.52",
                      "s": "100"
                    },
                    {
                      "p": "1.53",
                      "s": "40"
                    }
                  ],
                  "bids": [
                    {
                      "p": "1.17",
                      "s": "150"
                    },
                    {
                      "p": "1.16",
                      "s": "203"
                    }
                  ]
                }
              }
            }
          }
        },
        "security": []
      }
    },
