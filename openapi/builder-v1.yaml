openapi: 3.1.0
info:
  title: DexBuilder Builder API
  version: 1.0.0
  description: |
    API contract for projects building a DEX on DexBuilder.

    This specification defines the interface for Builder projects,
    user onboarding, funds, settlement, fees, revenue, analytics, and webhooks.

    Use the base URL, signing specification, credentials, chains, and contracts
    assigned to your DexBuilder environment.
  contact:
    email: contact@dexbuilder.com
tags:
  - name: Discovery
    description: Public chains, assets, contracts, and system status.
  - name: Accounts
    description: Wallet registration and account lookup.
  - name: Transaction Builder
    description: Construct wallet-ready transactions or typed messages.
  - name: Deposits
    description: Deposit quotes, submission, and status.
  - name: Withdrawals
    description: Withdrawal nonce, quote, submission, and status.
  - name: Settlement
    description: PnL settlement and account ledger.
  - name: Projects
    description: Builder project and credential administration.
  - name: Builder Users
    description: Builder-scoped user data.
  - name: Fees
    description: Protocol, effective, and Builder-configured fees.
  - name: Revenue
    description: Builder revenue ledger and payouts.
  - name: Analytics
    description: Builder-scoped product analytics.
  - name: Webhooks
    description: Signed webhook endpoints and delivery history.
security: []
paths:
  /v1/public/chains:
    get:
      tags: [Discovery]
      operationId: listSupportedChains
      summary: List supported chains
      responses:
        '200':
          description: Supported chains and service state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChainListResponse'
  /v1/public/assets:
    get:
      tags: [Discovery]
      operationId: listSupportedAssets
      summary: List supported collateral assets
      parameters:
        - name: chain_id
          in: query
          required: false
          schema: { type: integer, format: int64 }
      responses:
        '200':
          $ref: '#/components/responses/ListResponse'
  /v1/public/contracts:
    get:
      tags: [Discovery]
      operationId: listContractAddresses
      summary: List official contract addresses
      parameters:
        - name: chain_id
          in: query
          required: false
          schema: { type: integer, format: int64 }
        - name: contract_type
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/ListResponse'
  /v1/public/system/status:
    get:
      tags: [Discovery]
      operationId: getSystemStatus
      summary: Get system status by service
      responses:
        '200':
          description: System status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatusResponse'
  /v1/accounts/registration-nonce:
    get:
      tags: [Accounts]
      operationId: getRegistrationNonce
      summary: Get an account-registration nonce
      parameters:
        - name: builder_id
          in: query
          required: true
          schema: { type: string }
        - name: wallet_address
          in: query
          required: true
          schema: { type: string }
        - name: chain_id
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Registration nonce.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NonceResponse'
  /v1/accounts:
    post:
      tags: [Accounts]
      operationId: registerAccount
      summary: Register a wallet account under a Builder
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignedWalletAction'
      responses:
        '201':
          description: Registered account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
  /v1/accounts/by-wallet/{wallet_address}:
    get:
      tags: [Accounts]
      operationId: getAccountByWallet
      summary: Get the wallet account for a Builder
      parameters:
        - name: wallet_address
          in: path
          required: true
          schema: { type: string }
        - name: builder_id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
  /v1/transactions/build/account-registration:
    post:
      tags: [Transaction Builder]
      operationId: buildAccountRegistration
      summary: Build an account-registration message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [builder_id, wallet_address, chain_id, nonce]
              properties:
                builder_id: { type: string }
                wallet_address: { type: string }
                chain_id: { type: integer, format: int64 }
                nonce: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/TransactionBuildResponse'
  /v1/transactions/build/deposit:
    post:
      tags: [Transaction Builder]
      operationId: buildDeposit
      summary: Build a deposit transaction
      security:
        - TradingKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetActionRequest'
      responses:
        '200':
          $ref: '#/components/responses/TransactionBuildResponse'
  /v1/transactions/build/withdrawal:
    post:
      tags: [Transaction Builder]
      operationId: buildWithdrawal
      summary: Build a withdrawal message
      security:
        - TradingKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/AssetActionRequest'
                - type: object
                  required: [receiver, nonce]
                  properties:
                    receiver: { type: string }
                    nonce: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/TransactionBuildResponse'
  /v1/transactions/build/pnl-settlement:
    post:
      tags: [Transaction Builder]
      operationId: buildPnlSettlement
      summary: Build a PnL settlement message
      security:
        - TradingKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_id, builder_id, chain_id, nonce]
              properties:
                account_id: { type: string }
                builder_id: { type: string }
                chain_id: { type: integer, format: int64 }
                nonce: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/TransactionBuildResponse'
  /v1/deposits/quote:
    post:
      tags: [Deposits]
      operationId: quoteDeposit
      summary: Quote a deposit
      security:
        - TradingKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetActionRequest'
      responses:
        '200':
          $ref: '#/components/responses/FeeQuoteResponse'
  /v1/deposits:
    get:
      tags: [Deposits]
      operationId: listDeposits
      summary: List deposits
      security:
        - TradingKey: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/ListResponse'
    post:
      tags: [Deposits]
      operationId: submitDeposit
      summary: Submit a deposit transaction
      security:
        - TradingKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmittedWalletAction'
      responses:
        '202':
          description: Deposit accepted for processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionStatusResponse'
  /v1/deposits/{deposit_id}:
    get:
      tags: [Deposits]
      operationId: getDeposit
      summary: Get deposit status
      security:
        - TradingKey: []
      parameters:
        - name: deposit_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Deposit status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionStatusResponse'
  /v1/withdrawals/nonce:
    get:
      tags: [Withdrawals]
      operationId: getWithdrawalNonce
      summary: Get a withdrawal nonce
      security:
        - TradingKey: []
      responses:
        '200':
          description: Withdrawal nonce.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NonceResponse'
  /v1/withdrawals/quote:
    post:
      tags: [Withdrawals]
      operationId: quoteWithdrawal
      summary: Quote a withdrawal
      security:
        - TradingKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/AssetActionRequest'
                - type: object
                  required: [receiver]
                  properties:
                    receiver: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/FeeQuoteResponse'
  /v1/withdrawals:
    get:
      tags: [Withdrawals]
      operationId: listWithdrawals
      summary: List withdrawals
      security:
        - TradingKey: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/ListResponse'
    post:
      tags: [Withdrawals]
      operationId: submitWithdrawal
      summary: Submit a signed withdrawal
      security:
        - TradingKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignedWalletAction'
      responses:
        '202':
          description: Withdrawal accepted for processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionStatusResponse'
  /v1/withdrawals/{withdrawal_id}:
    get:
      tags: [Withdrawals]
      operationId: getWithdrawal
      summary: Get withdrawal status
      security:
        - TradingKey: []
      parameters:
        - name: withdrawal_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Withdrawal status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionStatusResponse'
  /v1/settlements/pnl/nonce:
    get:
      tags: [Settlement]
      operationId: getPnlSettlementNonce
      summary: Get a PnL settlement nonce
      security:
        - TradingKey: []
      responses:
        '200':
          description: Settlement nonce.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NonceResponse'
  /v1/settlements/pnl/quote:
    post:
      tags: [Settlement]
      operationId: quotePnlSettlement
      summary: Quote a PnL settlement
      security:
        - TradingKey: []
      responses:
        '200':
          $ref: '#/components/responses/FeeQuoteResponse'
  /v1/settlements/pnl:
    post:
      tags: [Settlement]
      operationId: submitPnlSettlement
      summary: Submit a signed PnL settlement
      security:
        - TradingKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignedWalletAction'
      responses:
        '202':
          description: Settlement accepted for processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionStatusResponse'
  /v1/settlements/{settlement_id}:
    get:
      tags: [Settlement]
      operationId: getSettlement
      summary: Get settlement status
      security:
        - TradingKey: []
      parameters:
        - name: settlement_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Settlement status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionStatusResponse'
  /v1/ledger/entries:
    get:
      tags: [Settlement]
      operationId: listAccountLedgerEntries
      summary: List account ledger entries
      security:
        - TradingKey: []
      parameters:
        - name: entry_type
          in: query
          required: false
          schema: { type: string }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/ListResponse'
  /v1/funding/payments:
    get:
      tags: [Settlement]
      operationId: listFundingPayments
      summary: List account-specific funding payments
      security:
        - TradingKey: []
      parameters:
        - name: contract
          in: query
          required: false
          schema: { type: string }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/ListResponse'
  /builder/v1/projects:
    get:
      tags: [Projects]
      operationId: listBuilderProjects
      summary: List Builder projects
      security:
        - BuilderAdmin: []
      responses:
        '200':
          $ref: '#/components/responses/ListResponse'
    post:
      tags: [Projects]
      operationId: createBuilderProject
      summary: Create a Builder project
      security:
        - BuilderAdmin: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, products]
              properties:
                name: { type: string }
                products:
                  type: array
                  items: { type: string, enum: [perpetuals, spot, event_contracts, prediction_markets] }
                launch_path: { type: string, enum: [white_label, ui_sdk, direct_api] }
      responses:
        '201':
          description: Created project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
  /builder/v1/projects/{project_id}:
    get:
      tags: [Projects]
      operationId: getBuilderProject
      summary: Get a Builder project
      security:
        - BuilderAdmin: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Builder project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
    patch:
      tags: [Projects]
      operationId: updateBuilderProject
      summary: Update a Builder project
      security:
        - BuilderAdmin: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Updated project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
  /builder/v1/api-keys:
    post:
      tags: [Projects]
      operationId: createBuilderAdminKey
      summary: Create a Builder Admin key
      description: The secret is returned only once and must remain server-side.
      security:
        - BuilderAdmin: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes, expires_at]
              properties:
                name: { type: string }
                scopes:
                  type: array
                  items: { type: string }
                expires_at: { type: integer, format: int64 }
                ip_allowlist:
                  type: array
                  items: { type: string }
      responses:
        '201':
          description: New Admin key. Secret is returned only in this response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  key_id: { type: string }
                  secret: { type: string, writeOnly: true }
                  scopes:
                    type: array
                    items: { type: string }
                  expires_at: { type: integer, format: int64 }
  /builder/v1/users:
    get:
      tags: [Builder Users]
      operationId: listBuilderUsers
      summary: List users attributed to the authenticated Builder
      security:
        - BuilderAdmin: []
      parameters:
        - name: wallet_address
          in: query
          required: false
          schema: { type: string }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/ListResponse'
  /v1/public/fees/base:
    get:
      tags: [Fees]
      operationId: getProtocolBaseFees
      summary: Get protocol base fees
      responses:
        '200':
          description: Protocol base fees.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeeConfigurationResponse'
  /v1/fees/effective:
    get:
      tags: [Fees]
      operationId: getEffectiveUserFees
      summary: Get the authenticated user's effective fees
      security:
        - TradingKey: []
      responses:
        '200':
          description: Effective user fees.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeeConfigurationResponse'
  /v1/fees/quote:
    post:
      tags: [Fees]
      operationId: quoteActionFees
      summary: Quote the fees for an action
      security:
        - TradingKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [trade, withdrawal, settlement] }
                contract: { type: string }
                notional: { $ref: '#/components/schemas/Decimal' }
                asset: { type: string }
                amount: { $ref: '#/components/schemas/Decimal' }
      responses:
        '200':
          $ref: '#/components/responses/FeeQuoteResponse'
  /builder/v1/fees/default:
    get:
      tags: [Fees]
      operationId: getBuilderDefaultFees
      summary: Get Builder default fees
      security:
        - BuilderAdmin: []
      responses:
        '200':
          description: Builder default fees.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeeConfigurationResponse'
    put:
      tags: [Fees]
      operationId: updateBuilderDefaultFees
      summary: Update Builder default fees
      security:
        - BuilderAdmin: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeeConfiguration'
      responses:
        '200':
          description: Applied Builder default fees.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeeConfigurationResponse'
  /builder/v1/fees/users:
    put:
      tags: [Fees]
      operationId: updateBuilderUserFees
      summary: Update user-specific fees in a batch
      security:
        - BuilderAdmin: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account_ids, fees]
              properties:
                account_ids:
                  type: array
                  maxItems: 500
                  items: { type: string }
                fees:
                  $ref: '#/components/schemas/FeeConfiguration'
      responses:
        '200':
          $ref: '#/components/responses/SuccessResponse'
  /builder/v1/revenue/summary:
    get:
      tags: [Revenue]
      operationId: getBuilderRevenueSummary
      summary: Get Builder revenue summary
      security:
        - BuilderAdmin: []
      parameters:
        - $ref: '#/components/parameters/FromTime'
        - $ref: '#/components/parameters/ToTime'
      responses:
        '200':
          $ref: '#/components/responses/ObjectResponse'
  /builder/v1/revenue/ledger:
    get:
      tags: [Revenue]
      operationId: listBuilderRevenueLedger
      summary: List fill-level Builder revenue entries
      security:
        - BuilderAdmin: []
      parameters:
        - $ref: '#/components/parameters/FromTime'
        - $ref: '#/components/parameters/ToTime'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/ListResponse'
  /builder/v1/payouts:
    get:
      tags: [Revenue]
      operationId: listBuilderPayouts
      summary: List Builder payouts
      security:
        - BuilderAdmin: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/ListResponse'
  /builder/v1/analytics/summary:
    get:
      tags: [Analytics]
      operationId: getBuilderAnalyticsSummary
      summary: Get Builder analytics summary
      security:
        - BuilderAdmin: []
      parameters:
        - $ref: '#/components/parameters/FromTime'
        - $ref: '#/components/parameters/ToTime'
        - name: interval
          in: query
          required: false
          schema: { type: string, enum: [hour, day, week, month], default: day }
      responses:
        '200':
          $ref: '#/components/responses/ObjectResponse'
  /builder/v1/webhooks:
    get:
      tags: [Webhooks]
      operationId: listWebhooks
      summary: List webhook endpoints
      security:
        - BuilderAdmin: []
      responses:
        '200':
          $ref: '#/components/responses/ListResponse'
    post:
      tags: [Webhooks]
      operationId: createWebhook
      summary: Create a signed webhook endpoint
      security:
        - BuilderAdmin: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events]
              properties:
                url: { type: string, format: uri }
                events:
                  type: array
                  items: { type: string }
      responses:
        '201':
          description: Webhook endpoint. Signing secret is returned only once.
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhook_id: { type: string }
                  signing_secret: { type: string, writeOnly: true }
                  url: { type: string, format: uri }
                  events:
                    type: array
                    items: { type: string }
  /builder/v1/webhook-deliveries:
    get:
      tags: [Webhooks]
      operationId: listWebhookDeliveries
      summary: List webhook deliveries
      security:
        - BuilderAdmin: []
      parameters:
        - name: webhook_id
          in: query
          required: false
          schema: { type: string }
        - name: status
          in: query
          required: false
          schema: { type: string }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/ListResponse'
components:
  securitySchemes:
    TradingKey:
      type: http
      scheme: bearer
      bearerFormat: signed-trading-key
      description: Scoped user Trading Key.
    BuilderAdmin:
      type: http
      scheme: bearer
      bearerFormat: builder-admin-key
      description: Server-side Builder Admin credential. Never expose it in a frontend.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
    ProjectId:
      name: project_id
      in: path
      required: true
      schema: { type: string }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    FromTime:
      name: from
      in: query
      required: true
      schema: { type: integer, format: int64, description: Unix time in milliseconds. }
    ToTime:
      name: to
      in: query
      required: true
      schema: { type: integer, format: int64, description: Unix time in milliseconds. }
  responses:
    SuccessResponse:
      description: Success.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessResponse'
    ObjectResponse:
      description: Success.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    ListResponse:
      description: Paginated list.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ListResponse'
    ErrorResponse:
      description: Request failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TransactionBuildResponse:
      description: Wallet-ready unsigned transaction or message.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TransactionBuildResponse'
    FeeQuoteResponse:
      description: Fee and action quote.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FeeQuoteResponse'
  schemas:
    Decimal:
      type: string
      pattern: '^-?[0-9]+(\.[0-9]+)?$'
      example: '100.00'
    SuccessResponse:
      type: object
      required: [success, request_id, timestamp]
      properties:
        success: { type: boolean, const: true }
        request_id: { type: string }
        timestamp: { type: integer, format: int64 }
    ErrorResponse:
      type: object
      required: [success, error, request_id, timestamp]
      properties:
        success: { type: boolean, const: false }
        error:
          type: object
          required: [code, message, retryable]
          properties:
            code: { type: string }
            message: { type: string }
            retryable: { type: boolean }
            details:
              type: object
              additionalProperties: true
        request_id: { type: string }
        timestamp: { type: integer, format: int64 }
    ListResponse:
      type: object
      required: [success, data, request_id, timestamp]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                type: object
                additionalProperties: true
            next_cursor: { type: [string, 'null'] }
        request_id: { type: string }
        timestamp: { type: integer, format: int64 }
    NonceResponse:
      type: object
      required: [success, data, request_id, timestamp]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [nonce, expires_at]
          properties:
            nonce: { type: string }
            expires_at: { type: integer, format: int64 }
        request_id: { type: string }
        timestamp: { type: integer, format: int64 }
    ChainListResponse:
      type: object
      required: [success, data, request_id, timestamp]
      properties:
        success: { type: boolean, const: true }
        data:
          type: array
          items:
            type: object
            required: [chain_id, chain_type, name, status]
            properties:
              chain_id: { type: integer, format: int64 }
              chain_type: { type: string, enum: [EVM, SOLANA] }
              name: { type: string }
              status: { type: string, enum: [AVAILABLE, DEGRADED, MAINTENANCE, DISABLED] }
              deposits_enabled: { type: boolean }
              withdrawals_enabled: { type: boolean }
              confirmation_count: { type: integer }
        request_id: { type: string }
        timestamp: { type: integer, format: int64 }
    SystemStatusResponse:
      type: object
      required: [success, data, request_id, timestamp]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          additionalProperties:
            type: object
            required: [status]
            properties:
              status: { type: string, enum: [AVAILABLE, DEGRADED, MAINTENANCE, DISABLED] }
              message: { type: string }
              expected_recovery_at: { type: [integer, 'null'], format: int64 }
        request_id: { type: string }
        timestamp: { type: integer, format: int64 }
    SignedWalletAction:
      type: object
      required: [request_hash, wallet_address, signature, message]
      properties:
        request_hash: { type: string }
        wallet_address: { type: string }
        signature: { type: string }
        message:
          type: object
          additionalProperties: true
    SubmittedWalletAction:
      type: object
      required: [request_hash, transaction_hash]
      properties:
        request_hash: { type: string }
        transaction_hash: { type: string }
    AssetActionRequest:
      type: object
      required: [account_id, builder_id, chain_id, asset, amount]
      properties:
        account_id: { type: string }
        builder_id: { type: string }
        chain_id: { type: integer, format: int64 }
        asset: { type: string, example: USDC }
        amount: { $ref: '#/components/schemas/Decimal' }
    TransactionBuildResponse:
      type: object
      required: [success, data, request_id, timestamp]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [request_hash, chain_type, chain_id, expires_at, human_readable_summary]
          properties:
            request_hash: { type: string }
            chain_type: { type: string, enum: [EVM, SOLANA] }
            chain_id: { type: integer, format: int64 }
            from: { type: string }
            to: { type: string }
            typed_data:
              type: object
              additionalProperties: true
            calldata: { type: string }
            serialized_message: { type: string }
            value: { $ref: '#/components/schemas/Decimal' }
            gas_estimate: { type: string }
            fee_quote:
              $ref: '#/components/schemas/FeeQuote'
            human_readable_summary: { type: string }
            risk_warnings:
              type: array
              items: { type: string }
            expires_at: { type: integer, format: int64 }
        request_id: { type: string }
        timestamp: { type: integer, format: int64 }
    FeeQuote:
      type: object
      properties:
        asset: { type: string }
        total_amount: { $ref: '#/components/schemas/Decimal' }
        components:
          type: array
          items:
            type: object
            required: [type, amount, asset]
            properties:
              type: { type: string }
              amount: { $ref: '#/components/schemas/Decimal' }
              asset: { type: string }
              rate: { $ref: '#/components/schemas/Decimal' }
    FeeQuoteResponse:
      type: object
      required: [success, data, request_id, timestamp]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [quote_id, fee_quote, expires_at]
          properties:
            quote_id: { type: string }
            fee_quote: { $ref: '#/components/schemas/FeeQuote' }
            expires_at: { type: integer, format: int64 }
        request_id: { type: string }
        timestamp: { type: integer, format: int64 }
    ActionStatusResponse:
      type: object
      required: [success, data, request_id, timestamp]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [id, status, created_at, updated_at]
          properties:
            id: { type: string }
            status:
              type: string
              enum: [CREATED, AWAITING_SIGNATURE, SUBMITTED, PROCESSING, CONFIRMED, REJECTED, FAILED_RETRYABLE, FAILED_FINAL]
            reason_code: { type: string }
            transaction_hash: { type: string }
            created_at: { type: integer, format: int64 }
            updated_at: { type: integer, format: int64 }
        request_id: { type: string }
        timestamp: { type: integer, format: int64 }
    AccountResponse:
      type: object
      required: [success, data, request_id, timestamp]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [account_id, builder_id, wallet_address, status, created_at]
          properties:
            account_id: { type: string }
            builder_id: { type: string }
            wallet_address: { type: string }
            chain_type: { type: string }
            status: { type: string, enum: [ACTIVE, RESTRICTED, CLOSED] }
            created_at: { type: integer, format: int64 }
        request_id: { type: string }
        timestamp: { type: integer, format: int64 }
    ProjectResponse:
      type: object
      required: [success, data, request_id, timestamp]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [project_id, builder_id, name, status, environment, created_at]
          properties:
            project_id: { type: string }
            builder_id: { type: string }
            name: { type: string }
            status: { type: string, enum: [DRAFT, SANDBOX_ACTIVE, REVIEW, PRODUCTION_ACTIVE, SUSPENDED] }
            environment: { type: string, enum: [sandbox, production] }
            products:
              type: array
              items: { type: string }
            created_at: { type: integer, format: int64 }
        request_id: { type: string }
        timestamp: { type: integer, format: int64 }
    FeeConfiguration:
      type: object
      required: [maker_fee_rate, taker_fee_rate]
      properties:
        maker_fee_rate:
          $ref: '#/components/schemas/Decimal'
        taker_fee_rate:
          $ref: '#/components/schemas/Decimal'
        rwa_maker_fee_rate:
          $ref: '#/components/schemas/Decimal'
        rwa_taker_fee_rate:
          $ref: '#/components/schemas/Decimal'
    FeeConfigurationResponse:
      type: object
      required: [success, data, request_id, timestamp]
      properties:
        success: { type: boolean, const: true }
        data:
          $ref: '#/components/schemas/FeeConfiguration'
        request_id: { type: string }
        timestamp: { type: integer, format: int64 }
