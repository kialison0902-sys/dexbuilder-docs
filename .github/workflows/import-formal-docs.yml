name: Import formal DexBuilder documentation

on:
  push:
    branches:
      - main
    paths:
      - dexbuilder-formal-docs.b64
      - .github/workflows/import-formal-docs.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace documentation source
        run: |
          base64 --decode dexbuilder-formal-docs.b64 > /tmp/dexbuilder-docs.zip
          mkdir -p /tmp/dexbuilder-docs-import
          unzip -q /tmp/dexbuilder-docs.zip -d /tmp/dexbuilder-docs-import
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name dexbuilder-formal-docs.b64 -exec rm -rf {} +
          cp -R /tmp/dexbuilder-docs-import/. .
          rm -f dexbuilder-formal-docs.b64
          rm -f .github/workflows/import-formal-docs.yml

      - name: Publish documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore formal Builder API documentation"
          git push
