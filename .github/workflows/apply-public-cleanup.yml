name: Apply public documentation cleanup

on:
  push:
    branches: [main]
    paths:
      - public-cleanup-20260814.b64
      - .github/workflows/apply-public-cleanup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply documentation package
        shell: bash
        run: |
          base64 --decode public-cleanup-20260814.b64 > /tmp/dexbuilder-docs.zip
          unzip -oq /tmp/dexbuilder-docs.zip -d "$GITHUB_WORKSPACE"
          rm -f \
            builder-api/api-availability.mdx \
            resources/api-coverage.mdx \
            zh/builder-api/api-availability.mdx \
            zh/resources/api-coverage.mdx \
            public-cleanup-20260814.b64 \
            .github/workflows/apply-public-cleanup.yml
      - name: Commit documentation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Remove internal API status language"
          git push
