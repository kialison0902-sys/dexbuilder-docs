name: Publish DexBuilder documentation

on:
  push:
    branches:
      - main
    paths:
      - ".codex-upload/publish-GuTSEM/payload.b64"
      - ".github/workflows/publish-dexbuilder-docs.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Replace documentation source
        shell: bash
        run: |
          base64 --decode .codex-upload/publish-GuTSEM/payload.b64 > /tmp/dexbuilder-docs-root.zip
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name .codex-upload -exec rm -rf {} +
          unzip -q /tmp/dexbuilder-docs-root.zip -d .
          rm -rf .codex-upload/publish-GuTSEM
          rm -f .github/workflows/publish-dexbuilder-docs.yml

      - name: Commit documentation update
        shell: bash
        run: |
          git config user.name "DexBuilder Docs Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Expand product docs and synchronize Trading API"
          git push origin main
