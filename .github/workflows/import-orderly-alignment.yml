name: Import DexBuilder Orderly alignment

on:
  push:
    paths:
      - "dexbuilder-orderly-alignment.b64"

permissions:
  contents: write

jobs:
  import-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace documentation
        shell: bash
        run: |
          set -euo pipefail
          work_dir=$(mktemp -d)
          mkdir -p "$work_dir/package"
          base64 --decode dexbuilder-orderly-alignment.b64 > "$work_dir/package.zip"
          unzip -q "$work_dir/package.zip" -d "$work_dir/package"
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' ! -name 'dexbuilder-orderly-alignment.b64' -exec rm -rf {} +
          cp -R "$work_dir/package/." .
          rm -f dexbuilder-orderly-alignment.b64
          rm -f .github/workflows/import-orderly-alignment.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Rebuild Builder docs from Orderly API parity"
          git push
