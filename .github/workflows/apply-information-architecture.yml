name: Apply documentation information architecture

on:
  push:
    branches: [main]
    paths:
      - navigation-redesign-20260814.b64
      - .github/workflows/apply-information-architecture.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply documentation package
        shell: bash
        run: |
          base64 --decode navigation-redesign-20260814.b64 > /tmp/dexbuilder-docs.zip
          unzip -oq /tmp/dexbuilder-docs.zip -d "$GITHUB_WORKSPACE"
          rm -f \
            navigation-redesign-20260814.b64 \
            .github/workflows/apply-information-architecture.yml
      - name: Commit documentation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Reorganize public documentation navigation"
          git push
