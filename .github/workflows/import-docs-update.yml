name: Import DexBuilder docs update

on:
  push:
    paths:
      - dexbuilder-docs-update.b64

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace documentation
        run: |
          base64 --decode dexbuilder-docs-update.b64 > /tmp/dexbuilder-docs.zip
          mkdir -p /tmp/dexbuilder-docs
          unzip -q /tmp/dexbuilder-docs.zip -d /tmp/dexbuilder-docs
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name dexbuilder-docs-update.b64 -exec rm -rf {} +
          cp -R /tmp/dexbuilder-docs/. .
          rm -f dexbuilder-docs-update.b64 .github/workflows/import-docs-update.yml
          rmdir .github/workflows .github 2>/dev/null || true
      - name: Commit documentation update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine DexBuilder docs and add architecture diagrams"
          git push
